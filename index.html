<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$AMZN - Premium Blue-Chip Meme Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0b0e14; color: #f0f6fc; min-height: 100vh; display: flex; flex-direction: column; }

        /* Amazon Dark Glassmorphism Header */
        .nav-top { 
            background: rgba(19, 25, 33, 0.85); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid rgba(255, 153, 0, 0.2); 
            padding: 12px 24px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        .logo { font-size: 24px; font-weight: 800; color: #ff9900; letter-spacing: -0.5px; }
        .logo span { color: #ffffff; font-weight: 300; }
        
        .search-bar { 
            display: flex; 
            flex: 1; 
            max-width: 500px; 
            margin: 0 20px; 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 8px; 
            overflow: hidden; 
        }
        .search-bar input { 
            width: 100%; 
            padding: 10px 14px; 
            background: transparent; 
            border: none; 
            color: #ff9900; 
            font-family: monospace; 
            font-size: 13px; 
            outline: none; 
        }
        .search-bar button { 
            background: #ff9900; 
            border: none; 
            padding: 10px 18px; 
            color: #131921; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        .search-bar button:hover { background: #ffad33; }

        /* Layout Grid */
        .container { 
            max-width: 1200px; 
            margin: 30px auto; 
            padding: 0 20px; 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 24px; 
            flex: 1; 
        }

        .glass-card { 
            background: rgba(23, 29, 37, 0.6); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 16px; 
            padding: 24px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
        }
        
        .glass-card h2 { 
            font-size: 18px; 
            font-weight: 600; 
            color: #ffffff; 
            margin-bottom: 16px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
        }
        .glass-card h2 span { color: #ff9900; font-size: 12px; border: 1px solid #ff9900; padding: 2px 8px; border-radius: 12px; }

        /* Canvas Box */
        .canvas-box { 
            background: radial-gradient(circle, rgba(255,153,0,0.05) 0%, rgba(0,0,0,0.2) 100%); 
            border: 1px dashed rgba(255, 255, 255, 0.15); 
            border-radius: 12px; 
            padding: 16px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin-bottom: 16px; 
        }
        canvas { max-width: 100%; height: auto; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); cursor: pointer; }

        /* Controls */
        .control-group { margin-bottom: 12px; }
        .control-group label { display: block; font-size: 12px; color: #8b949e; margin-bottom: 4px; }
        .control-group input[type="text"] { 
            width: 100%; 
            padding: 8px 12px; 
            background: rgba(0, 0, 0, 0.3); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 6px; 
            color: #fff; 
            outline: none; 
        }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .btn-option { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: #ccc; 
            padding: 8px; 
            border-radius: 6px; 
            font-size: 12px; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        .btn-option:hover, .btn-option.active { background: rgba(255, 153, 0, 0.2); border-color: #ff9900; color: #ff9900; }

        .btn-amazon { 
            background: linear-gradient(135deg, #ff9900 0%, #e68a00 100%); 
            color: #0b0e14; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            font-weight: 700; 
            cursor: pointer; 
            text-align: center; 
            text-decoration: none; 
            transition: all 0.2s ease; 
            box-shadow: 0 4px 12px rgba(255, 153, 0, 0.25); 
            display: block;
            width: 100%;
        }
        .btn-amazon:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(255, 153, 0, 0.4); }

        /* Spec List */
        .spec-list { list-style: none; font-size: 14px; }
        .spec-list li { 
            padding: 10px 0; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            display: flex; 
            justify-content: space-between; 
            color: #8b949e; 
        }
        .spec-list li strong { color: #f0f6fc; }

        footer { text-align: center; padding: 24px; color: #484f58; font-size: 12px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body>

    <div class="nav-top">
        <div class="logo">$AMZN<span>.Pons</span></div>
        <div class="search-bar">
            <input type="text" value="0xAMZN...PonsChainContract" id="caInput" readonly>
            <button onclick="navigator.clipboard.writeText('0xAMZN...PonsChainContract')">Copy CA</button>
        </div>
        <div style="font-size: 13px; color: #8b949e;">Prime Protocol</div>
    </div>

    <div class="container">
        
        <!-- Interactive Generator -->
        <div class="glass-card">
            <h2>Asset Studio <span>Interactive</span></h2>
            <div class="canvas-box">
                <canvas id="assetCanvas" width="260" height="260"></canvas>
            </div>
            
            <div class="control-group">
                <label>Custom Overlay Text</label>
                <input type="text" id="canvasText" value="$AMZN" oninput="updateRender()">
            </div>

            <div class="control-group">
                <label>Asset Preset Style</label>
                <div class="btn-grid">
                    <button class="btn-option active" id="btnOrb" onclick="setStyle('orb')">Blue-Chip Orb</button>
                    <button class="btn-option" id="btnPackage" onclick="setStyle('package')">Prime Parcel</button>
                </div>
            </div>

            <button class="btn-amazon" onclick="downloadAsset()">Download Custom Graphic (.PNG)</button>
        </div>

        <!-- Token Specs -->
        <div class="glass-card">
            <h2>Product Details <span>In Stock</span></h2>
            <ul class="spec-list">
                <li><span>Ticker</span> <strong>$AMZN</strong></li>
                <li><span>Blockchain</span> <strong>Pons Chain</strong></li>
                <li><span>Delivery</span> <strong>Instant Prime Settlement</strong></li>
                <li><span>Vault Reserve</span> <strong>100% Glassmorphic</strong></li>
                <li><span>Slippage</span> <strong>0%</strong></li>
            </ul>
            <a href="https://t.me" target="_blank" class="btn-amazon" style="margin-top: 16px;">Launch Telegram Raid</a>
        </div>

    </div>

    <footer>
        &copy; 2026 $AMZN Protocol. Built on Pons Blockchain.
    </footer>

    <script>
        let currentStyle = 'orb';

        function setStyle(style) {
            currentStyle = style;
            document.getElementById('btnOrb').classList.toggle('active', style === 'orb');
            document.getElementById('btnPackage').classList.toggle('active', style === 'package');
            updateRender();
        }

        function updateRender() {
            const canvas = document.getElementById('assetCanvas');
            const ctx = canvas.getContext('2d');
            const userText = document.getElementById('canvasText').value || '$AMZN';

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (currentStyle === 'orb') {
                // Outer Glow
                let outerGlow = ctx.createRadialGradient(130, 130, 50, 130, 130, 120);
                outerGlow.addColorStop(0, 'rgba(255, 153, 0, 0.2)');
                outerGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = outerGlow;
                ctx.fillRect(0, 0, 260, 260);

                // Blue-Chip Glass Orb
                let glassGrad = ctx.createRadialGradient(95, 85, 5, 130, 130, 95);
                glassGrad.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
                glassGrad.addColorStop(0.3, 'rgba(255, 153, 0, 0.3)');
                glassGrad.addColorStop(0.7, 'rgba(19, 25, 33, 0.85)');
                glassGrad.addColorStop(1, 'rgba(11, 14, 20, 0.98)');

                ctx.beginPath();
                ctx.arc(130, 130, 90, 0, Math.PI * 2);
                ctx.fillStyle = glassGrad;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.lineWidth = 1.5;
                ctx.fill();
                ctx.stroke();

                // Inner Reflection
                ctx.beginPath();
                ctx.arc(130, 130, 82, 1.2 * Math.PI, 1.8 * Math.PI);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Amazon Arrow
                ctx.beginPath();
                ctx.arc(130, 125, 50, 0.25 * Math.PI, 0.75 * Math.PI, false);
                ctx.strokeStyle = '#ff9900';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.stroke();

                // Arrowhead
                ctx.beginPath();
                ctx.fillStyle = '#ff9900';
                ctx.moveTo(165, 156);
                ctx.lineTo(175, 152);
                ctx.lineTo(170, 164);
                ctx.fill();

                // Dynamic Text
                ctx.fillStyle = '#ffffff';
                ctx.font = '700 22px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(userText, 130, 118);

            } else if (currentStyle === 'package') {
                // Glass Box Background Glow
                ctx.fillStyle = 'rgba(255, 153, 0, 0.05)';
                ctx.fillRect(0, 0, 260, 260);

                // Prime Package Base
                ctx.fillStyle = '#131921';
                ctx.strokeStyle = '#ff9900';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(40, 50, 180, 160, 16);
                ctx.fill();
                ctx.stroke();

                // Prime Ribbon Tape
                ctx.fillStyle = 'rgba(255, 153, 0, 0.2)';
                ctx.fillRect(115, 50, 30, 160);

                // Dynamic Text Overlay
                ctx.fillStyle = '#ff9900';
                ctx.font = '700 24px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(userText, 130, 125);

                ctx.fillStyle = '#ffffff';
                ctx.font = '600 12px -apple-system, sans-serif';
                ctx.fillText('PRIORITY DELIVERY', 130, 150);
            }
        }

        function downloadAsset() {
            const canvas = document.getElementById('assetCanvas');
            const link = document.createElement('a');
            link.download = `AMZN_${currentStyle}_asset.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        window.onload = updateRender;
    </script>
</body>
</html>
