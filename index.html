<script>
    // 1. SET YOUR ACTUAL CONTRACT ADDRESS HERE
    const CONTRACT_ADDRESS = "YOUR_PONS_CONTRACT_ADDRESS_HERE"; // e.g. "0x1234...5678"
    const PONS_DEX_URL = "https://ponsfamily.com"; // Your official launcher URL

    // Toast Notification & Direct Contract Clipboard Copy
    function copyCA() {
        if (CONTRACT_ADDRESS === "YOUR_PONS_CONTRACT_ADDRESS_HERE") {
            navigator.clipboard.writeText(window.location.href);
            showToast("Redirecting to Ponsfamily DEX...");
            setTimeout(() => { window.open(PONS_DEX_URL, '_blank'); }, 1000);
            return;
        }

        navigator.clipboard.writeText(CONTRACT_ADDRESS);
        showToast("Contract Address Copied to Clipboard!");
    }

    function showToast(message) {
        var toast = document.getElementById("toast");
        toast.innerText = message;
        toast.className = "show";
        setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
    }

    // 2. LIVE SHARE COUNTER & CALCULATOR (Synced with Live $AMZN Price)
    let amznStockPrice = 176.45; // Default market reference price
    let primeToAmznRatio = 0.00045; // Initial token conversion factor

    async function fetchLiveAmznPrice() {
        try {
            // Live financial API lookup for NASDAQ: AMZN
            const response = await fetch('https://query1.finance.yahoo.com/v8/finance/chart/AMZN');
            const data = await response.json();
            const livePrice = data.chart.result[0].meta.regularMarketPrice;
            if (livePrice) {
                amznStockPrice = livePrice;
                console.log("Updated live $AMZN price:", amznStockPrice);
            }
        } catch (error) {
            console.log("Using cached market price for $AMZN calculation.");
        }
    }

    function calculateValue() {
        let amount = document.getElementById('primeAmount').value;
        if (!amount || amount <= 0) {
            document.getElementById('calcResult').innerText = "0.00 $AMZN Shares Equivalent";
            return;
        }

        // Calculates exact share fraction based on token amount and live stock valuation
        let equivalentShares = (amount * primeToAmznRatio).toFixed(4);
        let totalUsdValue = (equivalentShares * amznStockPrice).toFixed(2);

        document.getElementById('calcResult').innerHTML = 
            `<span style="color: var(--accent-orange);">${equivalentShares} Shares</span> (~$${totalUsdValue} USD Value)`;
    }

    // Fetch stock market reference on page load
    fetchLiveAmznPrice();

    // 3. PERFORMANCE CHART RENDERING
    const ctx = document.getElementById('primeChart').getContext('2d');
    const primeChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['00:00', '04:00', '08:00', '12:00', '16:00', '20:00', '24:00'],
            datasets: [{
                label: '$PRIME / $AMZN Ratio on Ponsfamily DEX',
                data: [1.20, 1.45, 1.38, 1.75, 2.10, 2.35, 2.80],
                borderColor: '#00A2FF',
                backgroundColor: 'rgba(0, 162, 255, 0.15)',
                borderWidth: 3,
                fill: true,
                tension: 0.4
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { labels: { color: '#FFFFFF' } }
            },
            scales: {
                x: { ticks: { color: '#8E9BAE' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                y: { ticks: { color: '#8E9BAE' }, grid: { color: 'rgba(255,255,255,0.05)' } }
            }
        }
    });
</script>
